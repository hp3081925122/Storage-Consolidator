plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // 使用 Modrinth Maven 获取已核对的 26.1.2 NeoForge 构件。
    maven { url = 'https://api.modrinth.com/maven' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // 指定使用的 NeoForge 版本。
    version = project.neo_version

    // 访问转换器会自动检测，当前项目不需要额外配置。

    // 配置默认运行入口。
    runs {
        client {
            client()
            // 原测试世界尚在保存时，可用独立运行目录验证新代码，避免共用存档和日志。
            gameDirectory = file(providers.gradleProperty('clientRunDirectory').getOrElse('run'))

            // 指定要加载的 GameTest 命名空间，空值表示全部命名空间。
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 该入口启动 GameTestServer，执行已注册的回归测试后退出。
        gameTestServer {
            type = "gameTestServer"
            // 回归世界与玩家存档分离。
            gameDirectory = file('build/compat-test-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 如需单独的数据生成目录，可在此设置 gameDirectory。

            // 指定数据生成模组、输出目录和现有资源目录。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 以下配置应用于所有运行入口。
        configureEach {
            // 设置开发环境的日志标记。
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 设置控制台日志级别。
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 绑定模组与源集。
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 包含数据生成器输出的资源。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 生成最小空结构供库存回归使用，避免依赖其他模组的测试模板。
def compatStructure = tasks.register('generateCompatStructure') {
    def destination = layout.buildDirectory.dir('generated/compat-test-resources')
    outputs.dir(destination)
    doLast {
        def file = destination.get().file('data/storage_consolidator/structure/compat_empty.nbt').asFile
        file.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(file))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            out.writeInt(4); out.writeInt(4); out.writeInt(4)
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            out.writeByte(9); out.writeUTF('blocks'); out.writeByte(10); out.writeInt(0)
            out.writeByte(9); out.writeUTF('entities'); out.writeByte(10); out.writeInt(0)
            out.writeByte(0)
        }
    }
}
sourceSets.main.resources.srcDir(compatStructure)


dependencies {
    // 声明当前目标 NeoForge 开发运行时。
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // 编译期和开发运行期使用已核对的 Tom's Storage 26.1 构件。
    implementation "maven.modrinth:${toms_storage_maven_project}:${toms_storage_maven_version}"

    // 编译期使用 Sophisticated Core，运行期加载兼容测试模组。
    implementation "maven.modrinth:${sophisticated_core_maven_project}:${sophisticated_core_maven_version}"
    runtimeOnly "maven.modrinth:${sophisticated_storage_maven_project}:${sophisticated_storage_maven_version}"
    runtimeOnly "maven.modrinth:${sophisticated_backpacks_maven_project}:${sophisticated_backpacks_maven_version}"
    runtimeOnly "maven.modrinth:${lootr_maven_project}:${lootr_maven_version}"

    // JEI 依赖示例，当前项目不启用。
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // 本地 libs 模组依赖示例，当前项目不启用。
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // 文件依赖示例，当前项目不启用。
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // 同级或子项目依赖示例，当前项目不启用。
    // implementation project(":myproject")

    // 依赖配置按当前目标版本实际构件为准。
}

// 在处理资源时替换 26.1.2 元数据与资源包中的项目属性。
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [minecraft_version: project.minecraft_version,
                             minecraft_version_range: project.minecraft_version_range,
                             neo_version: project.neo_version,
                             neo_version_range: project.neo_version_range,
                             loader_version_range: project.loader_version_range,
                             mod_id: project.mod_id,
                             mod_name: project.mod_name,
                             mod_license: project.mod_license,
                             mod_version: project.mod_version,
                             mod_authors: project.mod_authors,
                             mod_description: project.mod_description,
                             toms_storage_version_range: project.toms_storage_version_range]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// 固定 Java 25 编译输出与 UTF-8 编码，避免目标版本使用旧字节码。
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// 配置 maven-publish 发布入口。
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// 让 IDEA 主动下载依赖的源码和文档包。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
