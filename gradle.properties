# 设置 Gradle 命令默认内存，可由命令行参数覆盖。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## 环境属性
# Minecraft 版本必须与 NeoForge 版本匹配。
minecraft_version=26.1.2
# Minecraft 版本范围使用正式版本边界。
minecraft_version_range=[26.1.2,27)
# NeoForge 版本必须与 Minecraft 版本匹配。
neo_version=26.1.2.95
# NeoForge 版本范围。
neo_version_range=[26.1.2.95,26.2)
# 加载器版本范围使用 FML 主版本边界。
loader_version_range=[4,)
## 模组属性
# 模组唯一标识，必须与入口类中的 @Mod 标识一致。
mod_id=storage_consolidator
# 模组显示名称。
mod_name=Storage Consolidator
# 模组许可证标识。
mod_license=MIT
# 模组版本号。
mod_version=0.1.0
# Maven 组标识，通常与源码基础包名保持一致。
mod_group_id=org.hp
# 模组作者显示文本。
mod_authors=HP
# 模组列表中显示的描述文本。
mod_description=为 Tom's Storage 添加安全的一键物品整理，并对高风险库存类型默认跳过。

# Tom's Storage 26.1 NeoForge 的 Modrinth 项目与版本 ID。
toms_storage_maven_project=XZNI4Cpy
toms_storage_maven_version=4gfSOCkU
toms_storage_version_range=[2.10.2,2.11)

# Modrinth 固定版本 ID，全部对应 Minecraft 26.1.2 NeoForge 正式版。
sophisticated_core_maven_project=nmoqTijg
sophisticated_core_maven_version=OoXooxvB
sophisticated_storage_maven_project=hMlaZH8f
sophisticated_storage_maven_version=DGzw01EG
sophisticated_backpacks_maven_project=TyCTlI4b
sophisticated_backpacks_maven_version=3xlcYe9r
lootr_maven_project=EltpO5cN
lootr_maven_version=WQ1wgJJ5
